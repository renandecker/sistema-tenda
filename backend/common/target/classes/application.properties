# Application
app.name=Sistema Tenda
app.version=1.0.0
app.timezone=America/Sao_Paulo
app.currency=BRL
app.locale=pt_BR

# Database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=sistematenda
quarkus.datasource.password=sistematenda
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/sistematenda

# Hibernate
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.format_sql=true

# REST
quarkus.resteasy-reactive.path=/api

# OpenAPI/Swagger
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.path=/swagger
quarkus.swagger-ui.always-include=true

# Logging
quarkus.log.level=INFO
quarkus.log.category."br.com.sistematenda".level=DEBUG
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2.}] %m%n

# Mailer
quarkus.mailer.host=localhost
quarkus.mailer.port=25
quarkus.mailer.from=noreply@sistematenda.com.br

# Scheduler
quarkus.scheduler.enabled=true

# Scale/Balança
scale.port=COM1
scale.baud-rate=9600
scale.data-bits=8
scale.stop-bits=1
scale.parity=NONE
scale.timeout-ms=5000
scale.protocol=TOLEDO
scale.auto-connect=true
scale.reconnect-interval-ms=10000

# Fiscal
fiscal.ambiente=HOMOLOGACAO
fiscal.uf=SP
fiscal.crt=1
fiscal.serie-nfce=1
fiscal.numero-nfce-inicial=1
fiscal.serie-nfe=1
fiscal.numero-nfe-inicial=1
fiscal.modelo-danfe=1
fiscal.webservice-timeout=30000
fiscal.schemas-path=schemas/

# Dev Mode
quarkus.devservices.enabled=true