# =============================================================================
# Sistema Tenda - Configuracao da Aplicacao (modulo PDV / app)
# =============================================================================

# -----------------------------------------------------------------------------
# Application
# -----------------------------------------------------------------------------
app.name=Sistema Tenda
app.version=1.0.0
app.timezone=America/Sao_Paulo
app.currency=BRL
app.locale=pt_BR

# -----------------------------------------------------------------------------
# Banco de Dados (PostgreSQL local - compativel com run.bat/docker)
# -----------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=sistematenda
quarkus.datasource.password=sistematenda
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/sistematenda

# -----------------------------------------------------------------------------
# Hibernate / JPA
# -----------------------------------------------------------------------------
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.format-sql=true

# -----------------------------------------------------------------------------
# Flyway
# -----------------------------------------------------------------------------
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
# Em banco ja existente (criado pelo dump antigo ou por versao anterior), cria o
# historico na versao 7 e aplica a V8, que garante o schema completo de forma
# idempotente. Em banco vazio, aplica V1..V8 normalmente.
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=7
quarkus.flyway.validate-on-migrate=false
# Bancos antigos podem ter sido migrados com uma versao anterior da V8 (o script
# foi ajustado depois de aplicado). Como as migrations sao idempotentes, a
# validacao de checksum e desativada para permitir que V9/V10 sejam aplicadas
# sem exigir um "flyway repair" manual em cada instalacao.
quarkus.flyway.clean-disabled=true

# -----------------------------------------------------------------------------
# REST / OpenAPI / Swagger
# -----------------------------------------------------------------------------
quarkus.resteasy-reactive.path=/api
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.path=/swagger
quarkus.swagger-ui.always-include=true

# -----------------------------------------------------------------------------
# Servidor HTTP
# -----------------------------------------------------------------------------
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# -----------------------------------------------------------------------------
# CORS (para desenvolvimento frontend)
# -----------------------------------------------------------------------------
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:3000,http://localhost:3001
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=Content-Type,Authorization,X-Signature,X-Timestamp
quarkus.http.cors.exposed-headers=X-Signature,X-Timestamp
quarkus.http.cors.access-control-allow-credentials=true

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
quarkus.log.level=INFO
quarkus.log.category."br.com.sistematenda".level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n

# -----------------------------------------------------------------------------
# Mailer
# -----------------------------------------------------------------------------
quarkus.mailer.host=localhost
quarkus.mailer.port=25
quarkus.mailer.from=noreply@sistematenda.com.br

# -----------------------------------------------------------------------------
# Scheduler
# -----------------------------------------------------------------------------
quarkus.scheduler.enabled=true

# -----------------------------------------------------------------------------
# Caixa - Fechamento automático (horário, formato HH:mm)
# Configurado via CAIXA_AUTO_CLOSE_HORA no arquivo .env
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Dev Mode (banco externo configurado acima; dev services desabilitados)
# -----------------------------------------------------------------------------
quarkus.devservices.enabled=false

# -----------------------------------------------------------------------------
# JWT (HMAC)
# -----------------------------------------------------------------------------
quarkus.oauth2.enabled=false
# O projeto usa JwtTokenService (jjwt) proprio e nenhum endpoint exige JWT.
# Desabilita o mecanismo Bearer do smallrye-jwt para nao rejeitar (401) o token do frontend.
quarkus.smallrye-jwt.enabled=false
jwt.secret=${JWT_SECRET:minha-chave-secreta-super-segura-para-desenvolvimento-local-32-chars-min}
jwt.expiration-hours=24
jwt.issuer=sistema-tenda

# -----------------------------------------------------------------------------
# Balanca, Fiscal e PIX: configurados via variaveis de ambiente (arquivo .env)
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Indexacao dos modulos do projeto (descoberta de beans/entidades pelo Quarkus)
# -----------------------------------------------------------------------------
quarkus.index-dependency.common.group-id=br.com.sistematenda
quarkus.index-dependency.common.artifact-id=sistema-tenda-common
quarkus.index-dependency.fruteira.group-id=br.com.sistematenda
quarkus.index-dependency.fruteira.artifact-id=sistema-tenda-fruteira
quarkus.index-dependency.buffet.group-id=br.com.sistematenda
quarkus.index-dependency.buffet.artifact-id=sistema-tenda-buffet
quarkus.index-dependency.estoque.group-id=br.com.sistematenda
quarkus.index-dependency.estoque.artifact-id=sistema-tenda-estoque
quarkus.index-dependency.fiscal.group-id=br.com.sistematenda
quarkus.index-dependency.fiscal.artifact-id=sistema-tenda-fiscal
