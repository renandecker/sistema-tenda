# =============================================================================
# Sistema Tenda - Configuracao da Aplicacao (modulo PDV / app)
# =============================================================================

# -----------------------------------------------------------------------------
# Application
# -----------------------------------------------------------------------------
app.name=Sistema Tenda
app.version=1.0.0
app.timezone=America/Sao_Paulo
app.currency=BRL
app.locale=pt_BR

# -----------------------------------------------------------------------------
# Banco de Dados (PostgreSQL local - compativel com run.bat/docker)
# -----------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=sistematenda
quarkus.datasource.password=sistematenda
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/sistematenda

# -----------------------------------------------------------------------------
# Hibernate / JPA
# -----------------------------------------------------------------------------
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.format_sql=true
quarkus.hibernate-orm.sql-load-script=import.sql

# -----------------------------------------------------------------------------
# REST / OpenAPI / Swagger
# -----------------------------------------------------------------------------
quarkus.resteasy-reactive.path=/api
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.path=/swagger
quarkus.swagger-ui.always-include=true

# -----------------------------------------------------------------------------
# Servidor HTTP
# -----------------------------------------------------------------------------
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# -----------------------------------------------------------------------------
# CORS (para desenvolvimento frontend)
# -----------------------------------------------------------------------------
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:3000,http://localhost:3001
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=Content-Type,Authorization,X-Signature,X-Timestamp
quarkus.http.cors.exposed-headers=X-Signature,X-Timestamp
quarkus.http.cors.credentials=true

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
quarkus.log.level=INFO
quarkus.log.category."br.com.sistematenda".level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n

# -----------------------------------------------------------------------------
# Mailer
# -----------------------------------------------------------------------------
quarkus.mailer.host=localhost
quarkus.mailer.port=25
quarkus.mailer.from=noreply@sistematenda.com.br

# -----------------------------------------------------------------------------
# Scheduler
# -----------------------------------------------------------------------------
quarkus.scheduler.enabled=true

# -----------------------------------------------------------------------------
# Dev Mode (banco externo configurado acima; dev services desabilitados)
# -----------------------------------------------------------------------------
quarkus.devservices.enabled=false

# -----------------------------------------------------------------------------
# JWT (HMAC)
# -----------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:minha-chave-secreta-super-segura-para-desenvolvimento-local-32-chars-min}
jwt.expiration-hours=24
jwt.issuer=sistema-tenda

# -----------------------------------------------------------------------------
# Balanca / Scale
# -----------------------------------------------------------------------------
scale.port=COM1
scale.baud-rate=9600
scale.data-bits=8
scale.stop-bits=1
scale.parity=NONE
scale.timeout-ms=5000
scale.protocol=TOLEDO
scale.auto-connect=true
scale.reconnect-interval-ms=10000

# -----------------------------------------------------------------------------
# Configuracoes Fiscais (NFC-e / NF-e / NFG)
# -----------------------------------------------------------------------------
fiscal.ambiente=HOMOLOGACAO
fiscal.certificado-path=/caminho/para/certificado.p12
fiscal.certificado-senha=senha_do_certificado
fiscal.csc=seu_csc_aqui
fiscal.csc-id=seu_csc_id_aqui
fiscal.uf=RS
fiscal.municipio-codigo=4314902
fiscal.municipio-nome=Porto Alegre
fiscal.cnpj=00000000000000
fiscal.inscricao-estadual=000000000
fiscal.inscricao-municipal=000000
fiscal.crt=1
fiscal.serie-nfce=1
fiscal.numero-nfce-inicial=1
fiscal.serie-nfe=1
fiscal.numero-nfe-inicial=1
fiscal.modelo-danfe=1
fiscal.logo-path=/caminho/para/logo.png
fiscal.webservice-timeout=30000
fiscal.schemas-path=schemas/
fiscal.nfce.enabled=true

# -----------------------------------------------------------------------------
# PIX Multi-Provider
# -----------------------------------------------------------------------------
# Provedor ativo: EFI, MERCADO_PAGO, ASAAS, ITAU, BRADESCO
pix.provider=EFI
pix.sandbox=true
pix.chave-pix=sua-chave-pix@exemplo.com
pix.webhook-base-url=https://seu-dominio.com
pix.expiracao-padrao-segundos=3600

