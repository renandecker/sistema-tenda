services:
  db:
    image: postgres:10
    container_name: sistematenda-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sistematenda
      POSTGRES_PASSWORD: sistematenda
      POSTGRES_DB: sistematenda
    ports:
      - "5433:5432"
    volumes:
      - sistematenda-pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sistematenda -d sistematenda"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    container_name: sistematenda-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/sistematenda
      QUARKUS_DATASOURCE_USERNAME: sistematenda
      QUARKUS_DATASOURCE_PASSWORD: sistematenda
      JWT_SECRET: ${JWT_SECRET:-minha-chave-secreta-super-segura-para-desenvolvimento-local-32-chars-min}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: sistematenda-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3001:80"

volumes:
  sistematenda-pgdata:
